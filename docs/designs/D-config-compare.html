<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>配置页四种形态对比 — ServerBox 设计稿</title>
<style>
/* ── 与 web/src/index.css 完全一致的 token ───────────────── */
:root{
  --base:#111311; --deep:#0a0c0a; --panel:#1c201d; --panel2:#232822; --raised:#2e352f;
  --line:#3d453d;
  --ink1:#eef1ec; --ink2:#b7c2b4; --ink3:#8b978a;
  --accent:#7cc24f; --accent-deep:#5d9c3a; --warn:#f2c14e; --danger:#e0574c; --cyan:#4aedd9;
  --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  /* 动效参数：顺滑档 200–300ms ease-out */
  --dur-fast:140ms; --dur:220ms; --dur-slow:300ms;
  --ease-out:cubic-bezier(.16,.84,.44,1);
}
/* 动效总开关：关掉之后所有过渡与入场动画一并停掉，方便直接对比 */
body.no-anim *{transition:none !important; animation:none !important;}

*{box-sizing:border-box}
html,body{margin:0;background:var(--base);color:var(--ink1);font-family:var(--sans);font-size:13.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
body{background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:32px 32px}
svg{shape-rendering:crispEdges;display:block}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 顶部控制条 ── */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 20px;background:var(--deep);border-bottom:3px solid #000}
.bar h1{margin:0;font-size:16px;font-weight:700}
.bar .sub{font-size:12px;color:var(--ink3)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.vbtn{padding:8px 14px;border:0;background:var(--panel);color:var(--ink2);font-size:13px;cursor:pointer;
  box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.vbtn:hover{background:var(--panel2);color:var(--ink1)}
.vbtn:active{transform:translateY(1px)}
.vbtn.on{background:var(--accent-deep);color:#0c1108;font-weight:700}
.switchline{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);cursor:pointer}

/* ── 开关控件（带过渡） ── */
.tg{position:relative;flex:0 0 auto;width:44px;height:22px;border:0;padding:0;background:#3f483e;cursor:pointer;
  box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;
  transition:background var(--dur) var(--ease-out)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#a3ada1;
  transition:left var(--dur) var(--ease-out),background var(--dur) var(--ease-out)}
.tg.on{background:#2c4720}
.tg.on::after{left:24px;background:var(--accent)}

/* ── 外壳：左世界列表 + 主区（四个变体共用） ── */
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 61px)}
.side{background:var(--deep);border-right:3px solid #000;padding:18px 14px}
.side .logo{display:flex;align-items:center;gap:10px;margin:0 4px 20px}
.side .logo b{font-size:15px}
.side .logo span{display:block;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.side .cap{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink3);margin:0 4px 10px}
.wrow{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;margin-bottom:6px;border:0;background:var(--panel);text-align:left;cursor:pointer;color:inherit;
  transition:background var(--dur-fast) var(--ease-out)}
.wrow:hover{background:var(--panel2)}
.wrow.on{background:var(--raised);box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000,inset 4px 0 0 0 var(--accent-deep)}
.wrow .nm{font-size:13.5px;font-weight:600;line-height:1.2}
.wrow .sb{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.dot{width:8px;height:8px;margin-left:auto;flex:0 0 auto}
.main{padding:20px 26px 60px;min-width:0}

/* ── 页面标题 ── */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:3px solid #000;padding-bottom:14px}
.head h2{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.head .st{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);padding:3px 10px;font-size:12px;color:var(--ink2)}
.head .meta{margin-top:6px;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.head .path{font-family:var(--mono);font-size:11.5px;color:var(--ink3);word-break:break-all}

/* ── 变体说明条 ── */
.note{margin:18px 0 0;padding:12px 16px;border-left:3px solid var(--cyan);background:#131b1a;font-size:12.5px;line-height:1.75;color:#c8e6e2}
.note b{color:var(--ink1)}

/* ── 搜索框 ── */
.search{display:flex;align-items:center;gap:9px;margin-top:18px;background:#0c0e0c;padding:8px 12px;max-width:380px;
  box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;
  transition:box-shadow var(--dur-fast) var(--ease-out)}
.search:focus-within{box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000,0 0 0 2px var(--accent-deep)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink1);font-family:var(--mono);font-size:12.5px}
.search input::placeholder{color:var(--ink3)}
.search .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}

/* ── 分组头 ── */
.gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:0}
.gh h3{margin:0;font-size:14px;font-weight:700}
.gh .n{font-size:12px;color:var(--ink3)}
.gh .desc{font-size:12px;color:var(--ink3)}

/* ── 通用控件 ── */
.inp{background:#0c0e0c;border:0;outline:0;color:var(--ink1);font-family:var(--mono);font-size:12.5px;padding:7px 10px;
  box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;
  transition:box-shadow var(--dur-fast) var(--ease-out)}
.inp:focus{box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000,0 0 0 2px var(--accent-deep)}
select.inp{cursor:pointer}
.fl{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
.fh{display:block;font-size:12px;color:var(--ink3);line-height:1.6}
.kv{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:0;background:#5f665e;color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:inset -3px -3px 0 0 rgba(0,0,0,.4),inset 3px 3px 0 0 rgba(255,255,255,.16),0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000;
  transition:background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn:hover{background:#6e766c}
.btn:active{transform:translateY(2px)}
.btn.g{background:var(--accent-deep);color:#0c1108}
.btn.g:hover{background:var(--accent)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.chip{display:inline-block;padding:2px 8px;background:var(--panel2);color:var(--ink2);font-family:var(--mono);font-size:11.5px;line-height:1.5}
.chip.w{background:var(--warn);color:#241a05;font-weight:700}
.chip.d{background:#5f2222;color:#ffc2c2}

/* ── 原生控件去割裂 ───────────────────────────────────
   1) number 输入框的系统 spinner 是白色小箭头，在深色主题里像贴上去的 —— 直接去掉，
      数值改用像素风的 [-] 值 [+] 来调（和向导里「内存」那一栏同一套）。
   2) 滚动条统一成项目里那套深色细条，别再让系统默认样式露出来。 */
input[type=number]{appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
*{scrollbar-width:thin;scrollbar-color:#39413a transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#39413a;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#4d574c;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* 数值步进：像素风的 [-] 值 [+] */
.step-ctl{display:flex;align-items:center;max-width:300px}
.step-ctl .inp{flex:1;min-width:0;text-align:center;box-shadow:none}
.step-ctl .sb{border:0;background:var(--raised);color:var(--ink1);font-size:15px;font-weight:700;
  padding:0 12px;height:32px;cursor:pointer;line-height:1;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.step-ctl .sb:hover{background:var(--accent-deep);color:#0c1108}
.step-ctl .sb:disabled{opacity:.35;cursor:default}
.step-ctl{box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;
  transition:box-shadow var(--dur-fast) var(--ease-out)}
.step-ctl:focus-within{box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000,0 0 0 2px var(--accent-deep)}

/* ── F · 只显示当前一组 + 滚动切换（用户要的形态） ── */
.f-wrap{display:grid;grid-template-columns:200px 1fr;gap:26px;margin-top:22px;align-items:start}
.f-nav{position:sticky;top:76px;background:var(--panel);padding:8px 0;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.f-nav .e-item{display:flex;align-items:center;gap:9px;width:100%;padding:11px 14px;border:0;
  background:transparent;color:var(--ink2);font-size:13.5px;cursor:pointer;text-align:left;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.f-nav .e-item:hover{background:var(--panel2);color:var(--ink1)}
.f-nav .e-item.on{background:var(--raised);color:var(--ink1);font-weight:700}
.f-nav .e-item .bar-l{width:3px;height:18px;flex:0 0 auto;background:transparent;
  transition:background var(--dur) var(--ease-out),transform var(--dur) var(--ease-out)}
.f-nav .e-item.on .bar-l{background:var(--accent);transform:scaleY(1.25)}
.f-nav .e-item .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.f-nav .f-pos{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.f-main{min-width:0}
.f-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:14px 18px;background:var(--panel);
  box-shadow:0 -3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.f-head h3{margin:0;font-size:16px;font-weight:700}
.f-head .n{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.f-head .desc{font-size:12.5px;color:var(--ink3)}
.f-head .idx{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.f-pane{max-height:min(58vh,540px);overflow-y:auto;background:var(--panel);padding:0 18px 14px;
  box-shadow:0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.f-pane-inner{animation:slideIn var(--dur-slow) var(--ease-out) both}
body.no-anim .f-pane-inner{animation:none}
.f-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--ink3)}
.f-foot .kb{margin-left:auto;display:flex;gap:8px}
.f-edge{height:26px;display:grid;place-items:center;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}

/* ── E · 左分类锚点 + 水平行（A+B 结合，推荐） ── */
.e-wrap{display:grid;grid-template-columns:176px 1fr;gap:26px;margin-top:22px;align-items:start}
.e-nav{position:sticky;top:76px;background:var(--panel);padding:8px 0;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.e-item{position:relative;display:flex;align-items:center;gap:9px;width:100%;padding:10px 14px;border:0;
  background:transparent;color:var(--ink2);font-size:13px;cursor:pointer;text-align:left;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.e-item:hover{background:var(--panel2);color:var(--ink1)}
.e-item.on{background:var(--raised);color:var(--ink1);font-weight:700}
.e-item .bar-l{width:3px;height:18px;flex:0 0 auto;background:transparent;
  transition:background var(--dur) var(--ease-out),transform var(--dur) var(--ease-out)}
.e-item.on .bar-l{background:var(--accent);transform:scaleY(1.25)}
.e-item .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.e-body{min-width:0}
.e-group{scroll-margin-top:96px}
.e-group+.e-group{margin-top:34px}

/* ── 变体容器：切换时淡入 ── */
.variant{display:none}
.variant.on{display:block;animation:rise var(--dur-slow) var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.no-anim .variant.on{animation:none}

/* 列表逐项浮现 */
.stagger>*{animation:fadeUp 320ms var(--ease-out) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.no-anim .stagger>*{animation:none}

/* ── A · 水平行 ── */
.anchors{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.anchor{padding:6px 12px;border:0;background:var(--panel);color:var(--ink2);font-size:12.5px;cursor:pointer;
  box-shadow:0 -2px 0 0 #000,0 2px 0 0 #000,-2px 0 0 0 #000,2px 0 0 0 #000;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.anchor:hover{background:var(--panel2);color:var(--ink1)}
.anchor.on{background:var(--accent-deep);color:#0c1108;font-weight:700}
.a-group{margin-top:30px;scroll-margin-top:120px}
.a-list{margin-top:2px;max-width:720px}
.a-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line);
  transition:background var(--dur-fast) var(--ease-out)}
.a-row:last-child{border-bottom:0}
.a-row:hover{background:rgba(255,255,255,.022)}
.a-row .lab{flex:0 0 330px;min-width:0}
.a-row .ctl{flex:0 1 300px;min-width:0;display:flex;align-items:center;gap:10px;max-width:100%}
.a-row .ctl>.inp,.a-row .ctl>select.inp{width:100%}

/* ── B · 左分类导航 ── */
.b-wrap{display:grid;grid-template-columns:210px 1fr;gap:0;margin-top:22px;min-height:520px}
.b-nav{background:var(--panel);box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000;padding:10px 0;align-self:start}
.b-item{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink2);font-size:13.5px;cursor:pointer;text-align:left;
  transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.b-item:hover{background:var(--panel2);color:var(--ink1)}
.b-item.on{background:var(--raised);color:var(--ink1);font-weight:700}
.b-item .bar-l{width:3px;height:20px;background:transparent;flex:0 0 auto;
  transition:background var(--dur) var(--ease-out)}
.b-item.on .bar-l{background:var(--accent)}
.b-item .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.b-body{padding-left:26px;min-width:0}
.b-pane{animation:slideIn var(--dur-slow) var(--ease-out) both}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
body.no-anim .b-pane{animation:none}
.b-card{margin-top:14px;background:var(--panel);box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.b-card .ch{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.b-card .ch p{flex-basis:100%}
.b-card .ch h4{margin:0;font-size:14px;font-weight:700}
.b-card .ch p{margin:4px 0 0;font-size:12px;color:var(--ink3)}
.b-card .cb{padding:4px 18px 14px}

/* ── C · 卡片网格 ── */
.c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;margin-top:22px}
.c-card{background:var(--panel);box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000;
  transition:transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out)}
.c-card:hover{transform:translateY(-2px)}
.c-card .ch{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.c-card .ch h4{margin:0;font-size:14px;font-weight:700}
.c-card .ch .n{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.c-card .cb{padding:6px 16px 14px}
.c-f{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.c-f:last-child{border-bottom:0}
.c-f .lab{flex:1;min-width:0}
.c-f .lab b{display:block;font-size:13px;font-weight:600}
.c-f .lab span{display:block;font-size:11.5px;color:var(--ink3);line-height:1.5}
.c-f .ctl{flex:0 0 auto}
.c-f .ctl .inp,.c-f .ctl select.inp{width:120px}
.c-f .ctl .inp.wide{width:150px}

/* ── D · 纯表格 ── */
.d-table{width:100%;border-collapse:collapse;margin-top:22px;background:var(--panel);
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.d-table th{background:var(--panel2);border-bottom:3px solid #000;padding:10px 16px;text-align:left;
  font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.12em;color:var(--ink3)}
.d-table td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.d-table tr:last-child td{border-bottom:0}
.d-table tbody tr{transition:background var(--dur-fast) var(--ease-out)}
.d-table tbody tr:hover{background:rgba(255,255,255,.026)}
.d-table .g td{background:#181c18;font-size:12px;font-weight:700;color:var(--ink1);letter-spacing:.04em;border-left:3px solid var(--accent-deep)}
.d-table .nm{font-size:13.5px;font-weight:600}
.d-table .ds{font-size:12px;color:var(--ink3);line-height:1.55}
.d-table .vl{text-align:right;white-space:nowrap}
.d-table .vl .inp,.d-table .vl select.inp{width:150px;text-align:left}

/* ── 底部栏 ── */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.hidden{display:none !important}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  /* 三栏在窄屏撑不住：分类导航从左侧竖栏收成顶部吸顶的横向锚点条 */
  .e-wrap{grid-template-columns:1fr;gap:0}
  .e-nav{position:sticky;top:61px;z-index:20;display:flex;overflow-x:auto;padding:0;margin-bottom:18px}
  .e-item{width:auto;white-space:nowrap;padding:11px 14px}
  .e-item .bar-l{display:none}
  .e-item .n{display:none}
  .b-wrap{grid-template-columns:1fr}
  .b-nav{display:flex;flex-wrap:wrap;padding:0}
  .b-item{width:auto;height:auto;padding:10px 14px}
  .b-item .n{display:none}
  .b-body{padding-left:0;padding-top:16px}
  .a-row .ctl{width:100%}
}
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>配置页 · 四种形态对比</h1>
    <div class="sub">同一份数据、同一套配色，只有「怎么排」不同。点右上角切换，注意看动效。</div>
  </div>
  <div class="seg" id="seg">
    <button class="vbtn on" data-v="f">F · 一组一屏（推荐）</button>
    <button class="vbtn" data-v="e">E · 左分类 + 水平行</button>
    <button class="vbtn" data-v="a">A · 水平行</button>
    <button class="vbtn" data-v="b">B · 左分类导航</button>
    <button class="vbtn" data-v="c">C · 卡片网格</button>
    <button class="vbtn" data-v="d">D · 纯表格</button>
  </div>
  <label class="switchline">
    <span>动效</span>
    <button class="tg on" id="animTg" role="switch" aria-checked="true" aria-label="动效开关"></button>
  </label>
</div>

<div class="app">
  <!-- 世界列表：四个变体共用的外壳 -->
  <aside class="side">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 16 16"><rect width="16" height="16" fill="#3b2a1a"/><rect width="16" height="5" fill="#5d9c3a"/><rect x="1" y="2" width="2" height="2" fill="#7cc24f"/><rect x="6" y="1" width="2" height="2" fill="#6f4520"/><rect x="2" y="7" width="3" height="2" fill="#6f4520"/><rect x="8" y="9" width="4" height="2" fill="#7cc24f"/></svg>
      <div><b>ServerBox</b><span>M1 · WIN</span></div>
    </div>
    <p class="cap">世界 / WORLDS</p>
    <button class="wrow on"><svg width="22" height="22" viewBox="0 0 16 16"><rect width="16" height="16" fill="#8f978f"/><rect width="16" height="5" fill="#e6e8e3"/><rect x="1" y="2" width="2" height="2" fill="#fff"/></svg><span><span class="nm">测试服</span><span class="sb">PAPER 1.20.4</span></span><span class="dot" style="background:var(--ink3)"></span></button>
    <button class="wrow"><svg width="22" height="22" viewBox="0 0 16 16"><rect width="16" height="16" fill="#3f7f92"/><rect width="16" height="5" fill="#9fd8e8"/><rect x="4" y="1" width="2" height="2" fill="#c6ecf7"/></svg><span><span class="nm">创造服 · 建筑</span><span class="sb">FABRIC 1.21.4</span></span><span class="dot" style="background:var(--accent)"></span></button>
  </aside>

  <main class="main">
    <div class="head">
      <svg width="24" height="24" viewBox="0 0 16 16"><rect width="16" height="16" fill="#8f978f"/><rect width="16" height="5" fill="#e6e8e3"/><rect x="1" y="2" width="2" height="2" fill="#fff"/></svg>
      <h2>测试服</h2>
      <span class="st"><span class="dot" style="background:var(--ink3);height:8px;width:8px"></span>已停止</span>
      <div style="width:100%">
        <div class="meta">PAPER 1.20.4 · 端口 25565</div>
        <div class="path">F:\项目\开服器\data\instances\i1791051528155</div>
      </div>
    </div>

    <!-- 搜索框：所有变体共用，用来验证「字段多了靠搜不靠扫」 -->
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="2" width="2" height="8" fill="#8b978a"/><rect x="2" y="2" width="8" height="2" fill="#8b978a"/><rect x="10" y="4" width="2" height="6" fill="#8b978a"/><rect x="4" y="10" width="6" height="2" fill="#8b978a"/><rect x="11" y="11" width="3" height="3" fill="#8b978a"/></svg>
      <input id="q" type="search" placeholder="搜字段名 / 键名，例如「端口」或 port" />
      <span class="cnt" id="qcnt"></span>
    </div>

    <p class="note" id="note"></p>

    <!-- ══ F · 右侧只显示当前一组 + 滚动切组 + 搜索（用户要的形态） ══ -->
    <section class="variant on" id="v-f">
      <div class="f-wrap">
        <nav class="f-nav" id="f-nav" aria-label="配置分组"></nav>
        <div class="f-main">
          <div class="f-head" id="f-head"></div>
          <div class="f-pane scroll-thin" id="f-pane"></div>
          <div class="f-foot">
            <span id="f-tip"></span>
            <span class="kb">
              <button class="btn sm" id="f-prev">← 上一组</button>
              <button class="btn sm" id="f-next">下一组 →</button>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- ══ E · 左分类锚点 + A 的水平行 ══ -->
    <section class="variant" id="v-e">
      <div class="e-wrap">
        <nav class="e-nav" id="e-nav" aria-label="配置分组"></nav>
        <div class="e-body" id="e-body"></div>
      </div>
    </section>

    <!-- ══ A · 水平行 + 分组锚点 ══ -->
    <section class="variant" id="v-a">
      <div class="anchors" id="anchors"></div>
      <div id="a-body"></div>
    </section>

    <!-- ══ B · 左分类导航 + 右内容 ══ -->
    <section class="variant" id="v-b">
      <div class="b-wrap">
        <nav class="b-nav" id="b-nav"></nav>
        <div class="b-body" id="b-body"></div>
      </div>
    </section>

    <!-- ══ C · 卡片网格 ══ -->
    <section class="variant" id="v-c">
      <div class="c-grid" id="c-grid"></div>
    </section>

    <!-- ══ D · 纯表格 ══ -->
    <section class="variant" id="v-d">
      <table class="d-table">
        <thead><tr><th style="width:180px">字段</th><th>说明</th><th style="width:190px;text-align:right">当前值</th></tr></thead>
        <tbody id="d-body"></tbody>
      </table>
    </section>

    <div class="foot">
      <button class="btn g" id="save">保存改动</button>
      <button class="btn" id="reset">放弃</button>
      <span class="kv" id="dirty">没有待保存的改动</span>
      <span class="kv" style="margin-left:auto">这个文件只在服务端启动时读一次，改完要重启才生效</span>
    </div>
  </main>
</div>

<script>
/* ── 数据：真实那 23 个字段 ───────────────────────────── */
const GROUP_DESC = {
  '网络与身份':'别人怎么连进来、以什么身份进来',
  '玩法':'游戏规则本身 —— 难度、模式、允许什么',
  '世界生成':'存档长什么样、跑多远、机器扛多少',
  '玩家管理':'谁能进、进来之后能干什么',
  '远程控制':'给外部工具用的通道，没需求别开',
};
const FIELDS = [
  {key:'server-port',label:'监听端口',g:'网络与身份',k:'int',v:'25565',h:'服务端真正监听的端口'},
  {key:'motd',label:'服务器标语',g:'网络与身份',k:'text',v:'A Minecraft Server',h:'服务器列表里显示的那句话'},
  {key:'online-mode',label:'正版验证',g:'网络与身份',k:'bool',v:true,h:'关掉才允许离线客户端进来'},
  {key:'max-players',label:'最大玩家数',g:'网络与身份',k:'int',v:'20'},
  {key:'network-compression-threshold',label:'网络压缩阈值',g:'网络与身份',k:'int',v:'256',h:'默认就行，不懂别动'},
  {key:'difficulty',label:'游戏难度',g:'玩法',k:'enum',v:'easy',o:['peaceful','easy','normal','hard']},
  {key:'gamemode',label:'默认游戏模式',g:'玩法',k:'enum',v:'survival',o:['survival','creative','adventure','spectator'],h:'新玩家进来时的模式'},
  {key:'pvp',label:'玩家互相伤害',g:'玩法',k:'bool',v:true},
  {key:'hardcore',label:'极限模式',g:'玩法',k:'bool',v:false,h:'死了就变旁观'},
  {key:'allow-flight',label:'允许飞行',g:'玩法',k:'bool',v:false,h:'装了飞行类模组必须开'},
  {key:'allow-nether',label:'允许去下界',g:'玩法',k:'bool',v:true},
  {key:'enable-command-block',label:'允许命令方块',g:'玩法',k:'bool',v:false},
  {key:'level-name',label:'世界文件夹名',g:'世界生成',k:'text',v:'world',h:'存档文件夹名，改名等于换世界'},
  {key:'level-seed',label:'世界种子',g:'世界生成',k:'text',v:''},
  {key:'view-distance',label:'视距',g:'世界生成',k:'int',v:'10',h:'调小最省性能'},
  {key:'simulation-distance',label:'模拟距离',g:'世界生成',k:'int',v:'10'},
  {key:'spawn-protection',label:'出生点保护半径',g:'世界生成',k:'int',v:'16',h:'半径内非 OP 不能破坏方块'},
  {key:'white-list',label:'启用白名单',g:'玩家管理',k:'bool',v:false},
  {key:'enforce-whitelist',label:'白名单强制踢出',g:'玩家管理',k:'bool',v:false,h:'把已在线的非白名单玩家踢掉'},
  {key:'player-idle-timeout',label:'挂机踢出（分钟）',g:'玩家管理',k:'int',v:'0',h:'0 为不踢'},
  {key:'enable-rcon',label:'开启 RCON',g:'远程控制',k:'bool',v:false,h:'给外部工具用的远程控制通道'},
  {key:'rcon.port',label:'RCON 端口',g:'远程控制',k:'int',v:'25575'},
  {key:'rcon.password',label:'RCON 密码',g:'远程控制',k:'text',v:'',h:'开了 RCON 就必须设'},
];
const GROUPS = ['网络与身份','玩法','世界生成','玩家管理','远程控制'];
const state = {};
FIELDS.forEach(f => state[f.key] = f.v);
let query = '';

const NOTE = {
  f:'<b>F · 一组一屏 + 滚动切组 + 搜索（你要的那个）</b> —— 右侧<strong>只显示当前这一组</strong>（B 的显示方式），'+
    '但内容长了能在面板内滚；<strong>滚到底再继续往下滚，就自动切到下一组</strong>，左侧同步高亮。也可以直接点左边或用下面的按钮。'+
    '<br>搜索时会自动切成「全部命中结果」铺开 —— 搜东西的时候不该再逼你按组翻。'+
    '<br>优点：单屏信息量刚好，不会像 E 那样一页摊 23 个字段滚半天；分类切换和滚动两种操作都留着。'+
    '<br>代价：面板高度固定（58vh），字段少的组会留白；滚轮切组在触控板上容易多切一格。',
  e:'<b>E · 左分类锚点 + 水平行（A 和 B 的结合）</b> —— 右侧是 A 那种连续滚动的水平行，左侧竖栏当锚点目录。'+
    '<b>关键：滚轮往下滚，左边会自动高亮你当前看到的那一组</b>（scroll-spy），点左边也能跳过去。'+
    '<br>优点：密度是 A 的，分类感是 B 的，不用为了换分类而丢开进度。窄屏下左侧收成顶部吸顶的横向锚点条。'+
    '<br>代价：桌面三栏（世界列表 + 分类 + 内容），1280px 以下内容列会变窄。',
  a:'<b>A · 水平行 + 分组锚点</b> —— 每项一行：左边「字段名 + 小字说明」，右边控件统一宽 300px、左边缘对齐。分组标题在左上角可点击跳转，顶部搜索框实时过滤。'+
    '<br>优点：密度最高、栅格永远不会歪（说明再长也只是左列变高）。缺点：窄屏要折行，左边那列说明会显得挤。',
  b:'<b>B · 左分类导航 + 右内容</b> —— PCL2 就是这种做法（它左栏固定 152px、条目高 36px、四个分类）。我按网页尺度放大到 210px / 44px。'+
    '<br>优点：单屏信息量最大，分类感最强，切换时有明确的「换页」反馈。缺点：桌面变成三栏（世界列表 + 分类 + 内容），手机上得退回上下堆叠。',
  c:'<b>C · 卡片网格</b> —— 每个分类一张卡，卡内字段紧凑排列，卡与卡之间靠留白分开，hover 时卡片轻微上浮。'+
    '<br>优点：分类边界最清楚，扫读快。缺点：卡片边框和间距吃掉不少空间，密度实际不如 A；字段多的分类（玩法 7 项）单卡会偏高。',
  d:'<b>D · 纯表格</b> —— 一行一个字段：字段名 | 说明 | 当前值。行 hover 高亮，值可以直接在行内改。'+
    '<br>优点：密度最高、最好扫，像配置文件的可视化编辑器。缺点：看着偏「数据库」不太像「设置」，也没地方放分类的说明文字。',
};

/* ── 渲染 ─────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 搜索匹配：字段名、键名、分组名都算
const hit = f => !query || (f.label + f.key + f.g).toLowerCase().includes(query.toLowerCase());
const shown = () => FIELDS.filter(hit);

function ctl(f, cls){
  const id = 'c-' + f.key;
  if (f.k === 'bool') {
    return `<button class="tg${state[f.key] ? ' on' : ''}" role="switch" aria-checked="${state[f.key]}" aria-label="${esc(f.label)}" data-k="${f.key}"></button>`;
  }
  if (f.k === 'enum') {
    return `<select class="inp ${cls||''}" data-k="${f.key}">${f.o.map(o => `<option${o===state[f.key]?' selected':''}>${o}</option>`).join('')}</select>`;
  }
  if (f.k === 'int') {
    // 不用原生 number —— 它的 spinner 是系统白色小箭头，和这套像素风割裂。
    // 换成 [-] 值 [+]，点起来更好点，也和向导里的内存栏一致。
    return `<span class="step-ctl ${cls||''}">`+
      `<button type="button" class="sb" data-step="${f.key}" data-d="-1" aria-label="${esc(f.label)} 减">−</button>`+
      `<input class="inp" type="text" inputmode="numeric" value="${esc(state[f.key])}" data-k="${f.key}" aria-label="${esc(f.label)}" />`+
      `<button type="button" class="sb" data-step="${f.key}" data-d="1" aria-label="${esc(f.label)} 加">+</button>`+
      `</span>`;
  }
  return `<input class="inp ${cls||''}" value="${esc(state[f.key])}" data-k="${f.key}" aria-label="${esc(f.label)}" />`;
}

function renderA(){
  $('#anchors').innerHTML = GROUPS.map(g =>
    `<button class="anchor" data-goto="${esc(g)}">${esc(g)}<span style="color:var(--ink3);margin-left:6px">${FIELDS.filter(f=>f.g===g).length}</span></button>`
  ).join('');
  $('#a-body').innerHTML = GROUPS.map(g => {
    const rows = shown().filter(f => f.g === g);
    if(!rows.length) return '';
    return `<section class="a-group" id="g-${esc(g)}" data-group="${esc(g)}">
      <div class="gh"><h3>${esc(g)}</h3><span class="n">${rows.length} 项</span><span class="desc">${esc(GROUP_DESC[g]||'')}</span></div>
      <div class="a-list stagger">${rows.map(f=>`
        <div class="a-row">
          <div class="lab"><span class="fl">${esc(f.label)}</span>${f.h?`<span class="fh">${esc(f.h)}</span>`:''}</div>
          <div class="ctl">${ctl(f)}</div>
        </div>`).join('')}</div>
    </section>`;
  }).join('');
  bind();
}

/* ── F：右侧只显示当前一组，滚到底继续滚就切下一组，左侧同步高亮 ── */
function fVis(){ return GROUPS.filter(g => shown().some(f => f.g === g)); }
function fCur(){ const vis = fVis(); return vis.includes(window._fGroup) ? window._fGroup : (vis[0] || GROUPS[0]); }
function rowHtml(f){
  return '<div class="a-row">' +
    '<div class="lab"><span class="fl">' + esc(f.label) + '</span>' + (f.h ? '<span class="fh">' + esc(f.h) + '</span>' : '') + '</div>' +
    '<div class="ctl">' + ctl(f) + '</div>' +
  '</div>';
}
function renderF(){
  const vis = fVis();
  if (!vis.length) {
    $('#f-nav').innerHTML = '';
    $('#f-head').innerHTML = '<h3>没有匹配的字段</h3>';
    $('#f-pane').innerHTML = '';
    $('#f-tip').textContent = '';
    return;
  }
  window._fGroup = fCur();
  const searching = !!query;

  $('#f-nav').innerHTML = GROUPS.map(g => {
    const has = shown().some(f => f.g === g);
    const on = !searching && g === window._fGroup;
    const dis = has ? '' : ' disabled style="opacity:.35"';
    return '<button class="e-item' + (on ? ' on' : '') + '" data-fg="' + esc(g) + '"' + dis + '>' +
      '<span class="bar-l"></span>' + esc(g) +
      '<span class="n">' + FIELDS.filter(f => f.g === g).length + '</span></button>';
  }).join('');

  const curIdx = vis.indexOf(window._fGroup);
  if (searching) {
    // 搜东西的时候把所有命中的组一起铺开 —— 这时候再逼你按组翻就太别扭了
    $('#f-head').innerHTML = '<h3>搜索结果</h3><span class="n">' + shown().length + ' 个字段</span>' +
      '<span class="desc">命中「' + esc(query) + '」的字段，按分组列在下面</span>';
    $('#f-pane').innerHTML = '<div class="f-pane-inner">' + vis.map(g =>
      '<div class="gh" style="margin-top:16px"><h3>' + esc(g) + '</h3><span class="n">' +
      shown().filter(f => f.g === g).length + ' 项</span></div>' +
      shown().filter(f => f.g === g).map(rowHtml).join('')
    ).join('') + '</div>';
    $('#f-tip').textContent = '搜索中 —— 清空搜索框就回到一组一屏';
  } else {
    const rows = shown().filter(f => f.g === window._fGroup);
    $('#f-head').innerHTML = '<h3>' + esc(window._fGroup) + '</h3><span class="n">' + rows.length + ' 项</span>' +
      '<span class="desc">' + esc(GROUP_DESC[window._fGroup] || '') + '</span>' +
      (vis.length > 1 ? '<span class="idx">第 ' + (curIdx + 1) + ' / ' + vis.length + ' 组</span>' : '');
    $('#f-pane').innerHTML = '<div class="f-pane-inner">' + rows.map(rowHtml).join('') + '</div>';
    $('#f-tip').textContent = '滚到底再往下滚 → 下一组（也可以直接点左边，或用右边的按钮）';
  }
  bind();
  const pane = $('#f-pane');
  if (pane) {
    pane.scrollTop = 0;
    // 滚到边界再继续滚就切组。只在非搜索模式下生效 —— 搜索结果是连续长列表，不该被截断。
    pane.addEventListener('wheel', ev => {
      if (query) return;
      const atBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 2;
      const atTop = pane.scrollTop <= 1;
      if (ev.deltaY > 0 && atBottom) { ev.preventDefault(); fStep(1); }
      else if (ev.deltaY < 0 && atTop) { ev.preventDefault(); fStep(-1); }
    }, { passive: false });
  }
  document.querySelectorAll('#f-nav .e-item').forEach(el => {
    el.onclick = () => { if (el.disabled) return; window._fGroup = el.dataset.fg; renderF(); };
  });
  const prev = $('#f-prev'), next = $('#f-next');
  if (prev) prev.onclick = () => fStep(-1);
  if (next) next.onclick = () => fStep(1);
}
function fStep(d){
  const vis = fVis();
  if (vis.length < 2) return;
  const i = vis.indexOf(fCur());
  window._fGroup = vis[(i + d + vis.length) % vis.length];
  renderF();
}

function renderE(){
  const vis = GROUPS.filter(g => shown().some(f => f.g === g));
  $('#e-nav').innerHTML = vis.map(g =>
    `<button class="e-item" data-t="eg-${esc(g)}"><span class="bar-l"></span>${esc(g)}<span class="n">${shown().filter(f=>f.g===g).length}</span></button>`
  ).join('');
  $('#e-body').innerHTML = vis.map(g => {
    const rows = shown().filter(f => f.g === g);
    return `<section class="e-group" id="eg-${esc(g)}">
      <div class="gh"><h3>${esc(g)}</h3><span class="n">${rows.length} 项</span><span class="desc">${esc(GROUP_DESC[g]||'')}</span></div>
      <div class="a-list stagger">${rows.map(f=>`
        <div class="a-row">
          <div class="lab"><span class="fl">${esc(f.label)}</span>${f.h?`<span class="fh">${esc(f.h)}</span>`:''}</div>
          <div class="ctl">${ctl(f)}</div>
        </div>`).join('')}</div>
    </section>`;
  }).join('');
  bind();
  // 点击跳转自己滚，不用 <a href> —— href 会改 location.hash，把「当前变体」那套状态带跑
  document.querySelectorAll('#e-nav .e-item').forEach(el => {
    el.onclick = () => {
      const t = document.getElementById(el.dataset.t);
      if (t) t.scrollIntoView({behavior: document.body.classList.contains('no-anim') ? 'auto' : 'smooth', block: 'start'});
      setActive(el.dataset.t);
    };
  });
  spy();
}

/* scroll-spy：滚轮往下滚，左边自动高亮当前看到的那一组。
   判定线取视口高度 32% 处而不是顶部 —— 眼睛判断「现在在哪一块」是按视线高度算的，
   卡在顶部会出现「明明还在看上一组，左边已经跳了」的违和感。 */
function setActive(id){
  document.querySelectorAll('#e-nav .e-item').forEach(n => n.classList.toggle('on', n.dataset.t === id));
}
function spy(){
  const items = [...document.querySelectorAll('#e-nav .e-item')];
  if (!items.length) return;
  const line = window.scrollY + window.innerHeight * 0.32;
  let cur = items[0].dataset.t;
  for (const it of items) {
    const g = document.getElementById(it.dataset.t);
    if (!g || g.offsetParent === null) continue;   // 隐藏的变体不算
    const top = g.getBoundingClientRect().top + window.scrollY;
    if (top <= line) cur = it.dataset.t;
  }
  setActive(cur);
}
window.addEventListener('scroll', spy, {passive:true});
window.addEventListener('resize', spy);

function renderB(){
  const cur = window._bGroup && GROUPS.includes(window._bGroup) ? window._bGroup : GROUPS[0];
  window._bGroup = cur;
  $('#b-nav').innerHTML = GROUPS.map(g =>
    `<button class="b-item${g===cur?' on':''}" data-b="${esc(g)}"><span class="bar-l"></span>${esc(g)}<span class="n">${FIELDS.filter(f=>f.g===g).length}</span></button>`
  ).join('');
  const rows = shown().filter(f => f.g === cur);
  $('#b-body').innerHTML = `<div class="b-pane">
    <div class="b-card" style="margin-top:0">
      <div class="ch"><h4>${esc(cur)}</h4><span class="n" style="font-family:var(--mono);font-size:11.5px;color:var(--ink3)">${rows.length} 项</span>
        <p>${esc(GROUP_DESC[cur]||'')} —— 这一组改完要重启服务器才生效</p></div>
      <div class="cb stagger">${rows.map(f=>`
        <div class="a-row">
          <div class="lab"><span class="fl">${esc(f.label)}</span>${f.h?`<span class="fh">${esc(f.h)}</span>`:''}</div>
          <div class="ctl">${ctl(f)}</div>
        </div>`).join('') || '<p class="fh" style="padding:14px 0">这一组里没有匹配「'+esc(query)+'」的字段。</p>'}</div>
    </div>
  </div>`;
  bind();
}

function renderC(){
  $('#c-grid').innerHTML = GROUPS.map(g => {
    const rows = shown().filter(f => f.g === g);
    if(!rows.length) return '';
    return `<div class="c-card">
      <div class="ch"><h4>${esc(g)}</h4><span class="n">${rows.length}</span></div>
      <div class="cb stagger">${rows.map(f=>`
        <div class="c-f">
          <span class="lab"><b>${esc(f.label)}</b>${f.h?`<span>${esc(f.h)}</span>`:''}</span>
          <span class="ctl">${ctl(f, f.k==='text'&&f.key==='motd'?'wide':'')}</span>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
  bind();
}

function renderD(){
  let html = '';
  for (const g of GROUPS) {
    const rows = shown().filter(f => f.g === g);
    if(!rows.length) continue;
    html += `<tr class="g"><td colspan="3">${esc(g)} · ${rows.length} 项 · ${esc(GROUP_DESC[g]||'')}</td></tr>`;
    html += rows.map(f=>`<tr>
      <td><span class="nm">${esc(f.label)}</span><br><span class="kv">${esc(f.key)}</span></td>
      <td><span class="ds">${esc(f.h || '—')}</span></td>
      <td class="vl">${ctl(f)}</td>
    </tr>`).join('');
  }
  $('#d-body').innerHTML = html;
  bind();
}

/* ── 交互绑定 ─────────────────────────────────────────── */
function bind(){
  document.querySelectorAll('.tg[data-k]').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.k;
      state[k] = !state[k];
      el.classList.toggle('on', state[k]);
      el.setAttribute('aria-checked', String(state[k]));
      // 同一字段在别的变体里也要同步 —— 换过去时不能显示旧值
      document.querySelectorAll('[data-k="'+k+'"]').forEach(o => {
        if (o.classList.contains('tg')) { o.classList.toggle('on', state[k]); o.setAttribute('aria-checked', String(state[k])); }
        else if (o.value !== String(state[k])) o.value = state[k];
      });
      dirty();
    };
  });
  document.querySelectorAll('.sb[data-step]').forEach(el => {
    el.onclick = (ev) => {
      const k = el.dataset.step, d = Number(el.dataset.d);
      // 按住 Shift 一次走 10 格 —— 端口那种五位数靠一格一格点太累
      const mult = ev.shiftKey ? 10 : 1;
      const cur = parseInt(state[k], 10);
      state[k] = String((Number.isFinite(cur) ? cur : 0) + d * mult);
      document.querySelectorAll('[data-k="' + k + '"]').forEach(o => { if (!o.classList.contains('tg')) o.value = state[k]; });
      dirty();
    };
  });
  document.querySelectorAll('select[data-k],input[data-k]:not(.tg)').forEach(el => {
    el.oninput = el.onchange = () => { state[el.dataset.k] = el.type==='number'? el.value : el.value; dirty(); };
  });
  document.querySelectorAll('.anchor').forEach(a => {
    a.onclick = () => {
      document.querySelectorAll('.anchor').forEach(x => x.classList.remove('on'));
      a.classList.add('on');
      const t = document.getElementById('g-' + a.dataset.goto);
      if (t) t.scrollIntoView({ behavior: document.body.classList.contains('no-anim') ? 'auto' : 'smooth', block: 'start' });
    };
  });
  document.querySelectorAll('.b-item').forEach(b => {
    b.onclick = () => { window._bGroup = b.dataset.b; renderB(); };
  });
}

function dirty(){
  const n = FIELDS.filter(f => String(state[f.key]) !== String(f.v)).length;
  $('#dirty').textContent = n ? `有 ${n} 项待保存` : '没有待保存的改动';
}

function renderAll(){
  renderF(); renderE(); renderA(); renderB(); renderC(); renderD();
  spy();
  const n = shown().length;
  $('#qcnt').textContent = query ? `${n} / ${FIELDS.length}` : `${FIELDS.length} 个字段`;
  // 搜索时把 anchor 也灰掉没有匹配项的分组
  document.querySelectorAll('.anchor').forEach(a => {
    a.classList.toggle('hidden', !shown().some(f => f.g === a.dataset.goto));
  });
  dirty();
}

/* ── 切换 ─────────────────────────────────────────────── */
function show(v){
  document.querySelectorAll('.variant').forEach(s => s.classList.remove('on'));
  const el = document.getElementById('v-' + v);
  // 重新加 class 才会重放动画（对应真实的「切页」手感）
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  document.querySelectorAll('.vbtn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#note').innerHTML = NOTE[v];
  location.hash = v;
}
$('#seg').onclick = e => { const b = e.target.closest('.vbtn'); if (b) show(b.dataset.v); };
$('#q').oninput = e => { query = e.target.value.trim(); renderAll(); };
$('#animTg').onclick = () => {
  const off = document.body.classList.toggle('no-anim');
  $('#animTg').classList.toggle('on', !off);
  $('#animTg').setAttribute('aria-checked', String(!off));
};
$('#save').onclick = () => { FIELDS.forEach(f => f.v = state[f.key]); dirty(); flash('已保存'); };
$('#reset').onclick = () => { FIELDS.forEach(f => state[f.key] = f.v); renderAll(); flash('已放弃改动'); };
function flash(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);padding:10px 18px;font-size:13px;z-index:99;box-shadow:0 0 0 3px #000';
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.transition = 'opacity 220ms,transform 220ms'; t.style.opacity='1'; });
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(6px)'; setTimeout(()=>t.remove(),260); }, 1800);
}

renderAll();
// 注意：判定用的值和传进去的值必须是同一个 —— 这里踩过坑。
// 写成「(hash||'#e') 判空、却把原始 hash 传进去」时，首次加载 hash 为空会传进空串，
// show('') 里 getElementById 拿到 null → 抛异常。而它抛之前那句「先摘掉所有变体的 on」
// 已经执行了，于是所有变体一起消失，页面看着像渲染失败。
const _h = (location.hash || '#f').slice(1);
show(/^[abcdef]$/.test(_h) ? _h : 'f');
</script>
</body>
</html>
